
services:

  # --------------------------------------------------
  # MySQL
  # --------------------------------------------------

  mysql:
    image: mysql:8.0
    container_name: url-shortener-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: url_shortener
      MYSQL_USER: url_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  # --------------------------------------------------
  # Redis
  # --------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped

    ports:
      - "6379:6379"


  # --------------------------------------------------
  # Laravel Application #1
  # --------------------------------------------------

  app1:
    build: .
    container_name: url-shortener-app1
    restart: unless-stopped

    environment:
      APP_ENV: local

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: url_shortener
      DB_USERNAME: url_user
      DB_PASSWORD: secret

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - mysql
      - redis


  # --------------------------------------------------
  # Laravel Application #2
  # --------------------------------------------------

  app2:
    build: .
    container_name: url-shortener-app2
    restart: unless-stopped

    environment:
      APP_ENV: local

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: url_shortener
      DB_USERNAME: url_user
      DB_PASSWORD: secret

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - mysql
      - redis


  # --------------------------------------------------
  # Laravel Application #3
  # --------------------------------------------------

  app3:
    build: .
    container_name: url-shortener-app3
    restart: unless-stopped

    environment:
      APP_ENV: local

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: url_shortener
      DB_USERNAME: url_user
      DB_PASSWORD: secret

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - mysql
      - redis


  # --------------------------------------------------
  # Nginx Load Balancer
  # --------------------------------------------------

  nginx:
    image: nginx:alpine
    container_name: url-shortener-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app1
      - app2
      - app3


# --------------------------------------------------
# Persistent volumes
# --------------------------------------------------

volumes:
  mysql_data:


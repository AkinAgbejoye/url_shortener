name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    php-tests:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  coverage: pcov
                  tools: composer:v2
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-
            - run: composer install --no-interaction --prefer-dist --no-progress
            - run: composer test:coverage
            - run: composer contract

    js-tests:
        name: Lint and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.npm
                      node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-node-
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run test:coverage
            - run: npm run build

    audit:
        name: Dependency audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  coverage: none
                  tools: composer:v2
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-
            - run: composer install --no-interaction --prefer-dist --no-progress
            - run: composer validate --strict
            - run: composer audit --locked
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.npm
                      node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-node-
            - run: npm ci
            - run: npm audit --audit-level=high

    e2e:
        name: Isolated Playwright e2e
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  coverage: none
                  tools: composer:v2
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-
            - run: composer install --no-interaction --prefer-dist --no-progress
            - run: php artisan config:clear --no-interaction
            - run: composer test:coverage
            - run: composer contract
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.npm
                      node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-node-
            - run: npm ci
            - run: npm run test:coverage
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e

    bootstrap:
        name: Fresh-clone bootstrap
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  coverage: none
                  tools: composer:v2
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-
            - run: composer install --no-interaction --prefer-dist --no-progress
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.npm
                      node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-node-
            - run: npm ci
            - run: cp .env.example .env && php artisan key:generate --no-interaction
            - run: touch database/database.sqlite && php artisan migrate --force --no-interaction
            - run: npm run build
            - run: php artisan test
            - run: npm test
            - name: Smoke test health endpoint
              run: |
                  php artisan serve --host=127.0.0.1 --port=8000 > /tmp/url-shortener-server.log 2>&1 &
                  server_pid=$!
                  trap 'kill "$server_pid" 2>/dev/null || true' EXIT
                  for attempt in {1..20}; do
                    if curl --fail --silent http://127.0.0.1:8000/api/health | grep --quiet '"status":"ok"'; then
                      exit 0
                    fi
                    sleep 1
                  done
                  cat /tmp/url-shortener-server.log
                  exit 1
